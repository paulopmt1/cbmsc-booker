name: Testes

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Mesma versão do Dockerfile de produção
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      # --no-scripts: os auto-scripts do Symfony (cache:clear) precisam das variáveis de produção
      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Rodar testes
        run: ./vendor/bin/phpunit
