services:
  # PHP + Apache service
  web:
    container_name: cbmsc_booker_web
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8084:80"
      - "8080:8080"
    volumes:
      - ./backend/:/var/www/html
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${MYSQL_USER:-cbmsc_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cbmsc_booker}
      - APP_RUNTIME_ENV=dev
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON:-}
      - CPF_DO_QUERUBIN=${CPF_DO_QUERUBIN:-000000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MySQL service
  db:
    container_name: cbmsc_booker_db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cbmsc_booker}
      - MYSQL_USER=${MYSQL_USER:-cbmsc_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # phpMyAdmin service
  phpmyadmin:
    container_name: cbmsc_booker_phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8085:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=${MYSQL_USER:-cbmsc_user}
      - PMA_PASSWORD=${MYSQL_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
